# Supabase Configuration - Testing config.toml parameter application
project_id = "zddkkqdzwkxyvzakriab"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Testing BOTH standard PostgreSQL and pg_cron parameters
[db.settings]
# Standard PostgreSQL parameters (should work if config.toml is applied)
statement_timeout = 30000
log_statement = "all"
# pg_cron parameters (we suspect these won't work)
cron.launch_active_jobs = false
cron.max_running_jobs = 0
cron.log_run = false

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 25

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[analytics]
enabled = false
